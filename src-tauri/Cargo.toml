[package]
name = "flowdesk-pro"
version = "0.9.2"
description = "Productividad local y privada para macOS"
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/JoseLMendozaV/flowdesk-pro"
authors = ["FlowDesk Pro"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowdesk_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.0", features = ["bundled", "chrono"] }
thiserror = "2"
calamine = "0.37.0"
rust_xlsxwriter = "0.101.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-single-instance = "2.5.4"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-window-state = "2.5.0"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-notification = "2.7.0"
libc = "0.2"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSArray", "NSData", "NSBundle"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
